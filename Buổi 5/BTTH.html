    <style>
        .product-list {
            display: flex;
            gap: var(--space-unit);
            justify-content: center;
        }
        .product-card {
            position: relative;
            width: 300px;
            height: 400px;
            border: 2px solid var(--main-color);
            border-radius: 10px;
            overflow: hidden;
            padding: 20px;
            box-sizing: border-box;
        }
        .badge-sale {
            position: absolute;
            top: var(--space-unit);
            right: var(--space-unit);
            background-color: var(--badge-color);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: inherit;
        }
        .btn-heart {
            position: absolute;
            top: var(--space-unit);
            left: var(--space-unit);
        }
        h3 {
            font-size: 18px;
            text-align: center;
            margin-bottom: 0;
        }
        header {

        }

            color: rgb(195, 57, 57);
        }
        .btn-buy {
            position: absolute;
            bottom: var(--space-unit);
            left: 50%;
            border-radius: 5px;
        }
        :root {
            --main-color: #a60dd4;
            --badge-color: red;
            --space-unit: 10px;
        }
    </style>   
</head>
