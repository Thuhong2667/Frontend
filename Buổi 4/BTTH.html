<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card + Box Model</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
    * {
        margin: 0; 
        padding: 0;
        box-sizing: border-box; 
    }
    body {
        font-family: "Be Vietnam Pro", Arial, sans-serif; 
        padding: 20px; 
    }
    .card {
            width: 100%;
            max-width: 280px;
            border: 1px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
    }
    .img {
        height: 120px; 
        background: #1a73d9; 
    }
    .body { 
        padding: 16px; 
    }
    .title { 
        font-size: 1.25rem; 
        font-weight: 700; 
        margin-bottom: 8px; 
    }
    .text { 
        font-size: 0.95rem;
        font-weight: 400; 
        line-height: 1.6; 
        color: #555; 
    }
   .card2 { 
    margin: 30px; 
    border: 4px solid navy; 
    }
    .card2 .body { 
        padding: 32px; 
    } 
    .box { 
        width: 200px; 
        padding: 20px; 
        border: 5px solid navy; 
        margin-bottom: 10px; 
    }
    .a { 
        box-sizing: content-box; 
    } 
    .b { 
        box-sizing: border-box; 
    }  
    </style>
</head>
<body>
    <h3>1. Card</h3>
    <div class="card">
        <div class="img"></div>
        <div class="body">
            <p class="title">Khám phá</p>
            <p class="text">Nội dung mô tả ngắn.</p>
        </div>
    </div>

    <h3>2. Đổi margin, padding, border</h3>
    <div class="card card2">
        <div class="img"></div>
        <div class="body">
            <p class="title">Khám phá</p>
            <p class="text">Nội dung mô tả ngắn.</p>
        </div>
    </div>

    <h3>3. box-sizing</h3>
    <div class="box a">content-box (250px)</div>
    <div class="box b">border-box (200px)</div>
</body>
</html>
